[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-player"
version = "1.0.0"
description = "ターミナルで動画をASCII / Unicode文字として再生するLinux向けCLI動画プレイヤー"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ascii", "video", "terminal", "cli", "youtube", "player"]
dependencies = [
    "yt-dlp>=2023.10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ascii-player = "ascii_player.cli:main"

[tool.setuptools]
packages = ["ascii_player"]